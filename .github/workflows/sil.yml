name: DC motor SIL

on:
  push:
  pull_request:

jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run calibration SIL test
        run: make sil
      - name: Run every student submission
        shell: bash
        run: |
          shopt -s nullglob
          for source in submissions/*/control_logic.c; do
            make clean
            make sil CONTROL_SOURCE="$source"
          done
